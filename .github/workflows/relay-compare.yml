name: Temporary FFmpeg Direct vs Relay Comparison

on:
  push:
    paths:
      - ".github/workflows/relay-compare.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Compare actual media delivery for 60 seconds each
        shell: bash
        run: |
          python - <<'PY'
          import json, os, select, subprocess, tempfile, time
          from pathlib import Path

          cfg = json.loads(Path("runtime.json").read_text())
          tests = [
              ("direct_origin", "http://edge01.cdn.omxx.net/live/ku/ku/unit/dunya_hd/tracks-v1a1/mono.ts.m3u8"),
              ("relay", cfg["base_url"].rstrip("/") + "/stream/43.ts?key=" + cfg["access_key"]),
          ]
          results = []
          for label, url in tests:
              item = {
                  "path": label, "channel_id": "43", "target_seconds": 60,
                  "http_status": None, "bytes_received": 0, "chunks": 0,
                  "first_media_seconds": None, "measured_seconds": 0,
                  "average_mbps": 0, "max_inter_chunk_gap_seconds": None,
                  "gaps_over_2s": 0, "ffmpeg_exit_code": None, "error": None
              }
              gaps = []
              with tempfile.TemporaryFile() as err:
                  cmd = [
                      "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error",
                      "-rw_timeout", "15000000", "-user_agent", "VLC/3.0.21",
                      "-i", url, "-map", "0", "-c", "copy", "-f", "mpegts", "pipe:1"
                  ]
                  started = time.monotonic()
                  proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=err, bufsize=0)
                  first = None
                  last = None
                  deadline = started + 80
                  try:
                      while time.monotonic() < deadline:
                          ready, _, _ = select.select([proc.stdout], [], [], 1)
                          if ready:
                              chunk = os.read(proc.stdout.fileno(), 65536)
                              now = time.monotonic()
                              if not chunk:
                                  break
                              if first is None:
                                  first = now
                                  item["first_media_seconds"] = round(now - started, 3)
                              if last is not None:
                                  gaps.append(now - last)
                              last = now
                              item["bytes_received"] += len(chunk)
                              item["chunks"] += 1
                          elif proc.poll() is not None:
                              break
                          if first is not None and time.monotonic() - first >= 60:
                              break
                      if proc.poll() is None:
                          proc.terminate()
                          try:
                              proc.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              proc.kill()
                              proc.wait()
                      item["ffmpeg_exit_code"] = proc.returncode
                  except Exception as e:
                      item["error"] = type(e).__name__ + ": " + str(e)[:150]
                      if proc.poll() is None:
                          proc.kill()
                          proc.wait()
                  finally:
                      proc.stdout.close()
                      err.seek(0)
                      err_text = err.read().decode("utf-8", "replace").strip()
                      if item["bytes_received"] == 0 and err_text and not item["error"]:
                          item["error"] = err_text[-300:]
              if first is not None:
                  item["measured_seconds"] = round((last or first) - first, 3)
              elapsed = max(item["measured_seconds"], 0.001)
              item["average_mbps"] = round(item["bytes_received"] * 8 / elapsed / 1_000_000, 3)
              if gaps:
                  item["max_inter_chunk_gap_seconds"] = round(max(gaps), 3)
                  item["gaps_over_2s"] = sum(g > 2 for g in gaps)
              results.append(item)
              print(json.dumps(item, indent=2))
          Path("direct-relay-comparison.json").write_text(json.dumps(results, indent=2))
          PY

      - name: Upload comparison result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-direct-relay-comparison
          path: direct-relay-comparison.json
          if-no-files-found: warn
          retention-days: 3
