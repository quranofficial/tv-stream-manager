name: Temporary Multi-Channel Stream Comparison

on:
  push:
    paths:
      - ".github/workflows/multi-stream-diagnostic.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Compare direct source and relay for three channels
        shell: bash
        run: |
          python - <<'PY'
          import json, os, selectors, subprocess, tempfile, time, urllib.request
          from pathlib import Path

          cfg = json.loads(Path("runtime.json").read_text(encoding="utf-8"))
          base = cfg["base_url"].rstrip("/")
          key = cfg["access_key"]
          channel_ids = ["43", "5392", "2634"]
          all_results = []

          def get_source(cid):
              url = f"{base}/source/{cid}?key={key}"
              req = urllib.request.Request(url, headers={"User-Agent": "VLC/3.0.21"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def measure(label, url, mode="muxed", audio_url=None):
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error",
                     "-rw_timeout", "20000000", "-user_agent", "VLC/3.0.21",
                     "-allowed_extensions", "ALL", "-extension_picky", "0",
                     "-i", url]
              if mode == "separate" and audio_url:
                  cmd += ["-rw_timeout", "20000000", "-allowed_extensions", "ALL",
                          "-extension_picky", "0", "-i", audio_url,
                          "-map", "0:v:0", "-map", "1:a:0"]
              else:
                  cmd += ["-map", "0:v:0", "-map", "0:a:0"]
              cmd += ["-t", "60", "-c", "copy", "-mpegts_flags", "+resend_headers",
                      "-f", "mpegts", "pipe:1"]

              result = {
                  "path": label, "http_status": None, "first_byte_seconds": None,
                  "measured_seconds": 0, "bytes_received": 0, "chunks": 0,
                  "average_mbps": 0, "max_inter_chunk_gap_seconds": None,
                  "gaps_over_2s": 0, "error": None
              }
              gaps = []
              started = time.monotonic()
              with tempfile.TemporaryFile() as errfile:
                  try:
                      proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=errfile)
                      fd = proc.stdout.fileno()
                      os.set_blocking(fd, False)
                      sel = selectors.DefaultSelector()
                      sel.register(fd, selectors.EVENT_READ)
                      first_at = last_at = None
                      deadline = started + 65
                      while time.monotonic() < deadline:
                          events = sel.select(timeout=1)
                          if not events:
                              if proc.poll() is not None:
                                  break
                              continue
                          try:
                              chunk = os.read(fd, 65536)
                          except BlockingIOError:
                              continue
                          now = time.monotonic()
                          if not chunk:
                              break
                          if first_at is None:
                              first_at = now
                              result["first_byte_seconds"] = round(first_at - started, 3)
                          if last_at is not None:
                              gaps.append(now - last_at)
                          last_at = now
                          result["bytes_received"] += len(chunk)
                          result["chunks"] += 1
                      if proc.poll() is None:
                          proc.terminate()
                          try:
                              proc.wait(timeout=4)
                          except subprocess.TimeoutExpired:
                              proc.kill()
                              proc.wait()
                      sel.close()
                      result["http_status"] = "ffmpeg_output"
                      if first_at is not None and last_at is not None:
                          result["measured_seconds"] = round(last_at - first_at, 3)
                      if result["bytes_received"] == 0:
                          result["error"] = "no_output"
                      if proc.returncode not in (0, -15, -9) and result["bytes_received"] == 0:
                          errfile.seek(0)
                          result["error"] = errfile.read().decode("utf-8", "replace")[-500:]
                  except Exception as exc:
                      result["error"] = type(exc).__name__ + ": " + str(exc)[:180]
              elapsed = max(result["measured_seconds"], 0.001)
              result["average_mbps"] = round(result["bytes_received"] * 8 / elapsed / 1_000_000, 3)
              if gaps:
                  result["max_inter_chunk_gap_seconds"] = round(max(gaps), 3)
                  result["gaps_over_2s"] = sum(g > 2 for g in gaps)
              return result

          for cid in channel_ids:
              entry = {"channel_id": cid, "source_name": None, "source_mode": None, "tests": []}
              try:
                  info = get_source(cid)
                  entry["source_name"] = info.get("name")
                  entry["source_mode"] = info.get("mode")
                  relay_url = info["relay_url"]
                  direct_url = info.get("direct_url") or info.get("video_url")
                  audio_url = info.get("audio_url")
                  if not direct_url:
                      raise RuntimeError("source_info_missing_direct_url")
                  entry["tests"].append(measure("relay", relay_url))
                  entry["tests"].append(measure("direct", direct_url, info.get("mode", "muxed"), audio_url))
              except Exception as exc:
                  entry["error"] = type(exc).__name__ + ": " + str(exc)[:180]
              all_results.append(entry)
              print(json.dumps(entry, ensure_ascii=False))

          Path("multi-stream-diagnostic.json").write_text(
              json.dumps(all_results, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-channel-stream-diagnostic
          path: multi-stream-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
