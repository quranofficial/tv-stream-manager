name: SportVip Source Test

on:
  push:
    branches: [main]
    paths:
      - "channels.json"
      - "bot.py"
      - ".github/workflows/sportvip-source-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bein-sports-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate SportVip catalogue and BEIN source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("channels.json").read_text(encoding="utf-8"))
          channels = data["data"]
          sports = [c for c in channels if c.get("genre") == "Sports"]
          sample = next((c for c in channels if str(c.get("id")) == "4353"), None)
          assert len(channels) == 595, f"Expected 595 sports channels, found {len(channels)}"
          assert len(sports) == 595, f"Non-sports entries found: {len(sports)}"
          assert sample and sample["name"] == "BEIN SPORTS NEWS", "Sample channel 4353 missing"
          assert sample.get("source_url", "").endswith("/tracks-v1a1/mono.ts.m3u8"), "Sample source URL missing"
          print(f"Catalogue OK: {len(channels)} sports channels")
          print(f"Sample: {sample['name']} (ID {sample['id']})")
          print(f"Source: {sample['source_url']}")
          PY

      - name: FFmpeg live source smoke test
        run: |
          URL="http://edge01.cdn.omxx.net/live/ar/qa/bein/bein_sports_news/tracks-v1a1/mono.ts.m3u8"
          timeout 55s ffmpeg -hide_banner -loglevel error \
            -rw_timeout 20000000 -allowed_extensions ALL -extension_picky 0 \
            -i "$URL" -map 0:v:0 -map 0:a:0 -t 4 -c copy -f mpegts -y /tmp/sportvip-bein-test.ts
          test -s /tmp/sportvip-bein-test.ts
          echo "BEIN SPORTS NEWS FFmpeg smoke test passed."
