name: Telegram TV Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: tv-telegram-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Cloudflare Tunnel
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          curl -L --fail --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          ffmpeg -version | head -n 1
          cloudflared --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start temporary public tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate \
            --loglevel info > /tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              echo "STREAM_PUBLIC_BASE=$URL" >> "$GITHUB_ENV"
              KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
              echo "STREAM_ACCESS_KEY=$KEY" >> "$GITHUB_ENV"
              echo "Temporary stream tunnel is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Cloudflare tunnel did not provide a public URL."
          cat /tmp/cloudflared.log
          exit 1

      - name: Publish live stream connection for Android app
        env:
          GH_TOKEN: ${{ github.token }}
          STREAM_PUBLIC_BASE: ${{ env.STREAM_PUBLIC_BASE }}
          STREAM_ACCESS_KEY: ${{ env.STREAM_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          path = "runtime.json"
          api = "https://api.github.com/repos/${{ github.repository }}/contents/" + path
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          try:
              req = urllib.request.Request(api, headers=headers)
              with urllib.request.urlopen(req) as response:
                  sha = json.load(response).get("sha")
          except Exception:
              sha = None
          payload = {
              "base_url": os.environ["STREAM_PUBLIC_BASE"],
              "access_key": os.environ["STREAM_ACCESS_KEY"],
              "updated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
          }
          body = {
              "message": "Update live stream endpoint for Android app",
              "content": base64.b64encode(json.dumps(payload).encode()).decode(),
              "branch": "main",
          }
          if sha:
              body["sha"] = sha
          req = urllib.request.Request(api, data=json.dumps(body).encode(), headers={**headers, "Content-Type":"application/json"}, method="PUT")
          with urllib.request.urlopen(req) as response:
              print("Android live endpoint published.")
          PY

      - name: Run Telegram bot and combined stream server
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py

      - name: Show tunnel diagnostics
        if: always()
        run: |
          if [ -f /tmp/cloudflared.log ]; then
            tail -n 40 /tmp/cloudflared.log
          fi
