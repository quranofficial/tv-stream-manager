name: Telegram TV Bot Watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bot.yml"
      - ".github/workflows/bot-watchdog.yml"
      - "bot.py"
      - "requirements.txt"
      - "channels.json"
      - "stream_keys.json"
      - "stream_modes.json"
      - "source_urls.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["Telegram TV Bot"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: telegram-tv-watchdog
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  monitor-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source for push-time validation
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Validate Python and JSON configuration
        if: github.event_name == 'push'
        run: |
          python -m py_compile bot.py
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("channels.json", "stream_keys.json", "stream_modes.json", "source_urls.json"):
              path = Path(name)
              if path.exists():
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"Valid JSON: {name}")
          print("Python syntax and JSON configuration checks passed.")
          PY

      - name: Validate workflow YAML syntax
        if: github.event_name == 'push'
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "Valid YAML: #{f}" }' \
            .github/workflows/bot.yml .github/workflows/bot-watchdog.yml

      - name: Check bot run and restart if it stopped
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, method="GET", payload=None, extra_headers=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=data, headers={**headers, **(extra_headers or {})}, method=method
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read()
                  return response.status, json.loads(body) if body else None

          # Validate both DNS and the live relay before treating a bot run as healthy.
          health_ok = False
          try:
              runtime_url = f"https://raw.githubusercontent.com/{repo}/main/runtime.json?health={datetime.datetime.now(datetime.timezone.utc).timestamp()}"
              with urllib.request.urlopen(runtime_url, timeout=10) as response:
                  runtime = json.load(response)
              base = runtime.get("base_url", "").rstrip("/")
              if base:
                  with urllib.request.urlopen(base + "/health", timeout=10) as response:
                      health = json.load(response)
                  health_ok = response.status == 200 and health.get("status") == "ok"
                  print("Public relay health:", health.get("status", "unknown"))
              else:
                  print("Relay health failed: runtime URL is empty.")
          except Exception as exc:
              print("Public relay health failed:", type(exc).__name__, str(exc)[:300])

          # Keep exactly one bot instance. If code was updated while an older
          # workflow is still running, cancel that stale instance and launch
          # the current commit so relay fixes take effect without manual steps.
          _, data = request(api_root + "/actions/workflows/bot.yml/runs?per_page=20")
          runs = data.get("workflow_runs", [])
          active = [r for r in runs if r.get("status") in ("queued", "in_progress")]
          current_sha = os.getenv("GITHUB_SHA", "")
          if active:
              run = active[0]
              stale_code = run.get("head_sha") != current_sha
              created = run.get("created_at")
              age_minutes = 0
              if created:
                  try:
                      started = datetime.datetime.fromisoformat(created.replace("Z", "+00:00"))
                      age_minutes = (datetime.datetime.now(datetime.timezone.utc) - started).total_seconds() / 60
                  except Exception:
                      pass
              if stale_code or (not health_ok and age_minutes >= 5):
                  print(
                      "Stopping stale/unhealthy bot before redeploy.",
                      "run_id=", run.get("id"),
                      "age_minutes=", round(age_minutes, 1),
                      "old_sha=", run.get("head_sha"),
                      "new_sha=", current_sha,
                  )
                  request(api_root + f"/actions/runs/{run['id']}/cancel", method="POST")
                  for _ in range(20):
                      import time
                      time.sleep(2)
                      _, latest = request(api_root + f"/actions/runs/{run['id']}")
                      if latest.get("status") == "completed":
                          break
              elif not health_ok:
                  print(
                      "Relay health is not ready yet; keeping the fresh bot run during startup grace.",
                      "run_id=", run.get("id"),
                      "age_minutes=", round(age_minutes, 1),
                  )
                  raise SystemExit(0)
              else:
                  print(
                      "Bot and public relay are healthy; no restart is needed.",
                      "run_id=", run.get("id"),
                      "status=", run.get("status"),
                  )
                  raise SystemExit(0)

          if runs:
              latest = runs[0]
              print(
                  "No active bot run found. Last conclusion:",
                  latest.get("conclusion") or latest.get("status"),
              )
          else:
              print("No previous bot run found; starting the first run.")

          status, _ = request(
              api_root + "/actions/workflows/bot.yml/dispatches",
              method="POST",
              payload={"ref": "main"},
          )
          print("Restart dispatch accepted by GitHub." if status == 204 else
                f"Unexpected dispatch response: HTTP {status}")
          PY
