name: Telegram TV Bot Watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bot.yml"
      - ".github/workflows/bot-watchdog.yml"
      - "bot.py"
      - "requirements.txt"
      - "channels.json"
      - "stream_keys.json"
      - "stream_modes.json"
      - "source_urls.json"
  schedule:
    - cron: "*/5 * * * *"
  # Restart immediately after the long-running bot workflow exits.
  workflow_run:
    workflows: ["Telegram TV Bot"]
    types: [completed]
  workflow_dispatch:

# Serialize watchdog events so simultaneous completions/checks cannot launch duplicates.
concurrency:
  group: telegram-tv-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository for validation
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Validate bot code and configuration
        if: github.event_name == 'push'
        run: |
          python -m py_compile bot.py
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("channels.json", "stream_keys.json", "stream_modes.json", "source_urls.json"):
              path = Path(name)
              if path.exists():
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"Valid JSON: {name}")
          PY
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "Valid YAML: #{f}" }' \
            .github/workflows/bot.yml .github/workflows/bot-watchdog.yml

      - name: Check active and queued bot runs; restart only when absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Checking Telegram TV Bot runs..."
          active="$(gh run list --repo "$GH_REPO" --workflow bot.yml --branch main --status in_progress --json databaseId --jq 'length')"
          queued="$(gh run list --repo "$GH_REPO" --workflow bot.yml --branch main --status queued --json databaseId --jq 'length')"

          echo "Active runs: $active"
          echo "Queued runs: $queued"

          if [ "$active" -eq 0 ] && [ "$queued" -eq 0 ]; then
            echo "Telegram TV Bot is not running. Starting it now..."
            gh workflow run bot.yml --ref main --repo "$GH_REPO"
            echo "Restart request sent."
          else
            echo "Telegram TV Bot is already active or queued. No duplicate run will be started."
          fi
