plugins { id 'com.android.application' }
android {
    namespace 'com.kurdish.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kurdish.tv'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '2.2.1'
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}
